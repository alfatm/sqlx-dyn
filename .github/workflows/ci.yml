name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # `cargo fmt --all --check` is not gated here yet: it currently fails on
      # files predating this workflow (examples/, tests/e2e.rs and others).
      # Reformatting them is a separate change from the logic fixes this
      # workflow was added for.
      - run: cargo clippy --workspace --all-targets

      # trybuild compares against committed .stderr files, which are sensitive
      # to the compiler version. A failure here usually means they need
      # regenerating with TRYBUILD=overwrite, not that the code is wrong.
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite starts its own PostgreSQL via testcontainers, so only Docker
      # is required — no service container and no DATABASE_URL.
      - run: cargo test -p sqlx_dyn --features e2e --test e2e
